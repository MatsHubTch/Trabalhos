<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        nav {
            text-align: center;
            margin-top: 50px;
        }
        nav a {
            display: inline-block;
            width: 200px;
            margin: 10px;
            padding: 12px;
            background-color: #292929; 
            color: white; 
            text-decoration: none;
            border-radius: 5px; 
            font-weight: bolder;
        }
        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        footer {
            text-align: center;
            padding: 20px;
            font-size: 14px;
            color: #888;
        }
        form {
            background-color: #121212;
            padding: 20px;
            border-radius: 8px;
        }
        .campo {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .radio-group, .checkbox-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .radio-inline, .checkbox-inline {
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: normal;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="date"],
        input[type="number"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 10px;
            background-color: #292929;
            border: 1px solid #444;
            border-radius: 5px;
            color: white;
            box-sizing: border-box;
        }
        .botoes {
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        button[type="submit"] {
            background-color: white;
            color: black;
        }
        button[type="reset"] {
            background-color: #292929;
            color: white;
        }
        .btn-voltar {
            display: inline-block;
            width: 200px;
            padding: 12px;
            background-color: #292929;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bolder;
            text-align: center;
            margin-top: 20px;
        }
        footer {
            text-align: center;
            padding: 20px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
    <main>
        <h2>Formulário de Cadastro</h2>
        <form action="#" method="POST">
            <div class="campo">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required minlength="3" maxlength="80" placeholder="Digite seu nome completo">
            </div>
            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required placeholder="exemplo@email.com">
            </div>
            <div class="campo">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required minlength="6" placeholder="Mínimo 6 caracteres">
            </div>
            <div class="campo">
                <label for="nascimento">Data de Nascimento:</label>
                <input type="date" id="nascimento" name="nascimento" required min="1900-01-01">
            </div>
            <div class="campo">
                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" required min="0" max="120" placeholder="Sua idade">
            </div>
            <div class="campo">
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" required pattern="[0-9]{2}[0-9]{5}[0-9]{4}" placeholder="31999999999">
            </div>
            <div class="campo">
                <label>Gênero:</label>
                <div class="radio-group">
                    <label class="radio-inline"><input type="radio" name="genero" value="masculino" required> Masculino</label>
                    <label class="radio-inline"><input type="radio" name="genero" value="feminino"> Feminino</label>
                    <label class="radio-inline"><input type="radio" name="genero" value="outro"> Outro</label>
                    <label class="radio-inline"><input type="radio" name="genero" value="air_frier"> Air Frier de 3 Auto-Limpante</label>
                </div>
            </div>
            <div class="campo">
                <label>Interesses:</label>
                <div class="checkbox-group">
                    <label class="checkbox-inline"><input type="checkbox" name="interesses" value="tecnologia"> Tecnologia</label>
                    <label class="checkbox-inline"><input type="checkbox" name="interesses" value="jogos"> Jogos</label>
                    <label class="checkbox-inline"><input type="checkbox" name="interesses" value="musica"> Música</label>
                    <label class="checkbox-inline"><input type="checkbox" name="interesses" value="esportes"> Esportes</label>
                </div>
            </div>
            <div class="campo">
                <label for="cidade">Cidade (Vale do Aço):</label>
                <select id="cidade" name="cidade" required>
                    <option value="" disabled selected>Selecione sua cidade</option>
                    <option value="timoteo">Timóteo</option>
                    <option value="coronel_fabriciano">Coronel Fabriciano</option>
                    <option value="ipatinga">Ipatinga</option>
                    <option value="santana_do_paraiso">Santana do Paraíso</option>
                    <option value="marliere">Marliéria</option>
                    <option value="jaguaraçu">Jaguaraçu</option>
                </select>
            </div>
            <div class="campo">
                <label for="comentarios">Comentários Adicionais:</label>
                <textarea id="comentarios" name="comentarios" rows="4" maxlength="500" placeholder="Escreva algo aqui..."></textarea>
            </div>
            <div class="botoes">
                <button type="submit">Enviar Cadastro</button>
                <button type="reset">Limpar Formulário</button>
            </div>
<a href="index.html" class="btn-voltar">VOLTAR</a>
        </a>
        </form>
    </main>
    <footer>
        &copy; 2026 - Mateus Filipe 202.
    </footer>
</body>
</html>
